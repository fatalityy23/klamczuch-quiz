<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KłamczuchQuiz</title>
<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#090910; --card:rgba(26,26,46,0.8); --accent:#ff2a5f; --accent2:#16213e;
    --text:#f0f0f0; --muted:#a0a0b0; --green:#00e676; --yellow:#ffd700; --blue:#00b4d8;
  }
  * { box-sizing:border-box; margin:0; padding:0; font-family:'Poppins', sans-serif; }
  body { background:var(--bg); color:var(--text); min-height:100vh; background-image:radial-gradient(circle at top, #1a1a2e, #090910); overflow-x:hidden; }
  .screen { display:none; padding:20px; max-width:1200px; margin:0 auto; animation: fadeIn .3s ease-out; }
  .screen.active { display:flex; flex-direction:column; gap:20px; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  .card { background:var(--card); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.05); border-radius:16px; padding:25px; box-shadow:0 8px 32px rgba(0,0,0,0.3); }
  button {
    background:linear-gradient(135deg, var(--accent), #c21844); color:#fff; border:none; border-radius:12px;
    padding:14px 28px; font-size:1.1rem; font-weight:600; cursor:pointer; transition:transform .2s;
  }
  input[type=text] { background:rgba(0,0,0,0.4); border:2px solid #333; color:#fff; padding:14px; border-radius:12px; width:100%; }
  .player-chip { display:inline-flex; align-items:center; gap:8px; background:var(--accent2); border-radius:20px; padding:8px 16px; margin:4px; }
  .answer-tile { background:rgba(22,33,62,0.6); border-left:4px solid var(--blue); border-radius:6px; padding:8px 12px; margin:6px 0; display:flex; justify-content:space-between; }
  .answer-tile.hidden { opacity: 0.3; border-left-color: #333; }
  .pts { color:var(--yellow); font-weight:800; }
  .timer-bar-wrap { background:#111; border-radius:8px; height:12px; overflow:hidden; margin:10px 0; }
  .timer-bar { height:100%; background:linear-gradient(90deg, var(--accent), var(--yellow)); transition:width 1s linear; }
  .score-row { display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid rgba(255,255,255,0.1); }
  #notification-toast {
    position:fixed; top:20px; left:50%; transform:translateX(-50%); background:var(--blue); color:white;
    padding:15px 30px; border-radius:30px; z-index:10000; font-weight:bold; display:none; animation: slideDown 0.4s;
  }
  @keyframes slideDown { from { top: -100px; } to { top: 20px; } }
</style>
</head>
<body>

<div id="notification-toast"></div>

<div id="pause-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:none; z-index:9999; justify-content:center; align-items:center;">
  <h1 style="font-size:4rem; color:var(--accent);">PAUZA</h1>
</div>

<div class="screen active" id="screen-join">
  <div style="text-align:center; padding:10vh 0;"><h1>KłamczuchQuiz</h1></div>
  <div class="card" style="max-width:400px; margin:0 auto;">
    <input type="text" id="player-name" placeholder="Twoje imię..." maxlength="20"/>
    <button onclick="joinGame()" style="width:100%; margin-top:15px;">Dołącz</button>
    <p id="join-error" style="color:var(--accent); text-align:center; margin-top:10px;"></p>
  </div>
</div>

<div class="screen" id="screen-lobby">
  <div class="card" style="text-align:center;">
    <h2>Poczekalnia</h2>
    <div id="lobby-players" style="margin-top:20px;"></div>
  </div>
</div>

<div class="screen" id="screen-game">
  <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #333; padding-bottom:10px;">
    <h1>Runda <span id="round-num"></span></h1>
    <div id="my-name-display" style="color:var(--blue);"></div>
  </div>
  <div style="display:grid; grid-template-columns: 2fr 1fr; gap:20px; margin-top:20px;">
    <div class="card">
      <h2 id="question-text"></h2>
      <div id="turn-info" style="margin-top:20px; font-size:1.4rem;">
        <span id="turn-name" style="color:var(--yellow);"></span> <span id="turn-label"></span>
      </div>
      <div class="timer-bar-wrap"><div class="timer-bar" id="timer-bar" style="width:100%"></div></div>
      <div id="answer-section" style="display:none; margin-top:20px;">
        <input type="text" id="answer-input" placeholder="Twoja odpowiedź..."/>
        <button onclick="submitAnswer()" style="margin-top:10px; width:100%;">Wyślij</button>
      </div>
      <div id="reveal-msg" style="display:none; text-align:center; padding:15px; border-radius:12px; margin-top:10px; font-weight:bold;"></div>
    </div>
    <div style="display:flex; flex-direction:column; gap:20px;">
      <div id="liar-panel" class="card" style="display:none; border:2px solid var(--accent);">
        <h3 style="color:var(--accent);">🔴 KŁAMCZUCH</h3>
        <div id="liar-answers-list"></div>
      </div>
      <div id="normal-answers" class="card">
        <h3>Odpowiedzi</h3>
        <div id="revealed-answers"></div>
      </div>
    </div>
  </div>
</div>

<div class="screen" id="screen-scoreboard">
  <div class="card" style="max-width:800px; margin:0 auto; width:100%;">
    <h1 style="text-align:center; color:var(--yellow);">RANKING PO RUNDZIE</h1>
    <div id="global-timer-display" style="text-align:center; font-size:2rem; margin:10px 0;"></div>
    <div id="scoreboard-table" style="margin-top:20px;"></div>
  </div>
</div>

<div class="screen" id="screen-round-summary">
  <div class="card">
    <h1 style="text-align:center;">Wszystkie odpowiedzi</h1>
    <div id="rs-all-answers" style="margin-top:20px;"></div>
  </div>
</div>

<div class="screen" id="screen-voting">
  <div class="card" style="text-align:center;">
    <h2 id="vote-title">Głosowanie</h2>
    <div id="vote-timer" style="font-size:3rem; color:var(--yellow);"></div>
    <div id="voting-grid" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap:15px; margin-top:20px;"></div>
  </div>
</div>

<div class="screen" id="screen-voting-results">
  <div class="card">
    <h2 style="text-align:center;">Wyniki Głosowania</h2>
    <div id="voting-verdict" style="margin:20px 0; padding:20px; border-radius:12px; text-align:center; font-size:1.2rem;"></div>
    <div id="voting-details"></div>
  </div>
</div>

<div class="screen" id="screen-pre-final">
  <div class="card" style="text-align:center;">
    <h1>Wielki Finał</h1>
    <div id="pre-final-announcement" style="font-size:1.5rem; margin:20px 0;"></div>
    <button onclick="socket.emit('rulesUnderstood')">Gotowy!</button>
  </div>
</div>

<div class="screen" id="screen-speeches">
  <div class="card" style="text-align:center;">
    <h1>Czas na obronę!</h1>
    <div id="speech-player" style="font-size:3rem; color:var(--green); margin:20px 0;"></div>
    <div id="speech-timer" style="font-size:4rem; color:var(--yellow);"></div>
  </div>
</div>

<div class="screen" id="screen-final">
  <div class="card" style="text-align:center;">
    <h1>Koniec Gry!</h1>
    <div id="final-verdict" style="margin:30px 0;"></div>
    <div id="final-scoreboard"></div>
  </div>
</div>

<script>
const socket = io();
let myName = '';
let currentPhase = '';

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function joinGame() {
  const name = document.getElementById('player-name').value.trim();
  if (name) { myName = name; socket.emit('joinGame', { name }); }
}

socket.on('error', m => document.getElementById('join-error').textContent = m);

socket.on('adminNotification', data => {
  const toast = document.getElementById('notification-toast');
  toast.textContent = data.message;
  toast.style.display = 'block';
  setTimeout(() => toast.style.display = 'none', 5000);
});

socket.on('state', s => {
  document.getElementById('pause-overlay').style.display = s.isPaused ? 'flex' : 'none';
  
  if (s.phase === 'lobby') {
    showScreen('screen-lobby');
    document.getElementById('lobby-players').innerHTML = s.players.map(p => `<span class="player-chip">${p.name}</span>`).join('');
  }

  if (s.phase === 'round') {
    showScreen('screen-game');
    document.getElementById('round-num').textContent = s.currentRound;
    document.getElementById('question-text').textContent = s.questionText;
    document.getElementById('my-name-display').textContent = s.myName;

    const isMyTurn = s.currentPlayerName === s.myName;
    document.getElementById('turn-name').textContent = isMyTurn ? "TWOJA KOLEJ" : s.currentPlayerName;
    document.getElementById('turn-label').textContent = isMyTurn ? "" : "odpowiada...";
    document.getElementById('answer-section').style.display = isMyTurn ? 'block' : 'none';

    // Panel kłamczucha
    if (s.liarAnswers) {
      document.getElementById('liar-panel').style.display = 'block';
      document.getElementById('liar-answers-list').innerHTML = s.liarAnswers.map((a, i) => {
        const rev = s.revealedAnswers.find(r => r.index === i);
        // ZMIANA: Pokazujemy kto zgadł
        return `<div style="padding:5px; border-bottom:1px solid #333; opacity:${rev?'0.4':'1'}">
                  ${a.text} (${a.points}) ${rev && rev.byName !== 'System' ? ' - <small>'+rev.byName+'</small>' : ''}
                </div>`;
      }).join('');
    } else {
      document.getElementById('liar-panel').style.display = 'none';
    }

    // Odpowiedzi na ekranie
    document.getElementById('revealed-answers').innerHTML = Array.from({length: s.answerCount}).map((_, i) => {
      const rev = s.revealedAnswers.find(r => r.index === i);
      return `<div class="answer-tile ${rev?'':'hidden'}">
                <span>${i+1}. ${rev ? rev.text : '???'} ${rev && rev.byName !== 'System' ? '<small>('+rev.byName+')</small>' : ''}</span>
                <span class="pts">${rev ? rev.points : '---'}</span>
              </div>`;
    }).join('');
  }

  if (s.phase === 'roundSummary') {
    showScreen('screen-round-summary');
    document.getElementById('rs-all-answers').innerHTML = s.allAnswers.map((a, i) => {
        const rev = s.revealedAnswers.find(r => r.index === i);
        return `<div class="answer-tile ${rev?'':'hidden'}">
                  <span>${i+1}. ${rev ? a.text : '???'}</span>
                  <span class="pts">${a.points}</span>
                </div>`;
    }).join('');
  }

  if (s.phase === 'scoreboard') {
    showScreen('screen-scoreboard');
    const table = document.getElementById('scoreboard-table');
    
    let html = `<div style="display:grid; grid-template-columns: 50px 1fr 100px ${s.isVotingNext?'120px':''}; gap:10px; font-weight:bold; border-bottom:2px solid #555; padding-bottom:10px;">
                  <span>Lp.</span><span>Gracz</span><span>Suma</span>${s.isVotingNext?'<span>W tej turze</span>':''}
                </div>`;
    
    s.players.forEach((p, i) => {
      // Obliczanie różnicy od ostatniego głosowania
      const oldScore = s.lastVoteScores[p.name] || 0;
      const diff = p.score - oldScore;

      html += `<div class="score-row">
                 <span>${i+1}.</span>
                 <span>${p.name}</span>
                 <span style="color:var(--yellow)">${p.score} pkt</span>
                 ${s.isVotingNext ? `<span style="color:var(--green)">+${diff}</span>` : ''}
               </div>`;
    });
    table.innerHTML = html;
  }

  if (s.phase === 'voting' || s.phase === 'finalVoting') {
    showScreen('screen-voting');
    document.getElementById('vote-title').textContent = s.phase === 'finalVoting' ? "Werdykt Jury" : "Kto kłamie?";
    const grid = document.getElementById('voting-grid');
    grid.innerHTML = '';
    const targets = s.phase === 'finalVoting' ? s.players.filter(p => s.top2.includes(p.name)) : s.players;
    targets.forEach(p => {
        if (p.name === s.myName) return;
        const btn = document.createElement('button');
        btn.textContent = p.name;
        btn.onclick = () => socket.emit('vote', { votedName: p.name });
        grid.appendChild(btn);
    });
  }

  if (s.phase === 'votingResults') {
    showScreen('screen-voting-results');
    const verdict = s.liarHistory[s.liarHistory.length - 1];
    const el = document.getElementById('voting-verdict');
    if (verdict.caught) {
        el.innerHTML = `<span style="color:var(--green)">ZŁAPANY!</span><br>Kłamczuchem był <b>${verdict.liarName}</b>`;
        el.style.border = "2px solid var(--green)";
    } else {
        el.innerHTML = `<span style="color:var(--accent)">KŁAMCZUCH UCIEKŁ!</span>`;
        el.style.border = "2px solid var(--accent)";
    }
  }

  if (s.phase === 'speeches') {
    showScreen('screen-speeches');
    document.getElementById('speech-player').textContent = s.speechPlayerName;
  }

  if (s.phase === 'finalSummary') {
    showScreen('screen-final');
    if (currentPhase !== 'finalSummary') confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
    const verdict = s.liarHistory[s.liarHistory.length - 1];
    document.getElementById('final-verdict').innerHTML = verdict.caught ? 
        `<h2 style="color:var(--green)">Jury miało rację!</h2><p>${verdict.liarName} został zdemaskowany.</p>` :
        `<h2 style="color:var(--accent)">Kłamca wygrał!</h2><p>${verdict.liarName} oszukał wszystkich.</p>`;
  }

  currentPhase = s.phase;
});

socket.on('timerStart', d => {
  const bar = document.getElementById('timer-bar');
  const msg = document.getElementById('reveal-msg');
  if (d.phase === 'reveal') {
    msg.style.display = 'block';
    msg.textContent = d.message;
    msg.style.color = d.correct ? 'var(--green)' : 'var(--accent)';
  } else {
    msg.style.display = 'none';
  }
  let t = d.duration;
  bar.style.width = '100%';
  const itv = setInterval(() => {
    t--;
    bar.style.width = (t/d.duration*100)+'%';
    if (t <= 0) clearInterval(itv);
  }, 1000);
});

socket.on('globalCountdown', d => {
    const el = document.getElementById('global-timer-display');
    if (el) el.textContent = d.timeLeft > 0 ? `Pozostało: ${d.timeLeft}s` : '';
});

socket.on('votingTimer', d => {
    const v = document.getElementById('vote-timer'); if(v) v.textContent = d.timeLeft + 's';
    const s = document.getElementById('speech-timer'); if(s) s.textContent = d.timeLeft + 's';
});

function submitAnswer() {
  const input = document.getElementById('answer-input');
  if (input.value.trim()) { socket.emit('submitAnswer', { answer: input.value.trim() }); input.value = ''; }
}
</script>
</body>
</html>

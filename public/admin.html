<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Admin – Kłamczuch</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  body { background:#0f0f1a; color:#eee; font-family:sans-serif; padding:20px; }
  .card { background:#1a1a2e; padding:20px; border-radius:12px; margin-bottom:10px; border:1px solid #333; }
  button { padding:10px; cursor:pointer; font-weight:bold; }
  .btn-green { background:#2ecc71; border:none; color:white; }
  .btn-accent { background:#e94560; border:none; color:white; }
</style>
</head>
<body>

<div id="login" class="card">
  <input type="password" id="pwd" placeholder="Hasło..."/>
  <button onclick="login()">Zaloguj</button>
</div>

<div id="main" style="display:none;">
  <div class="card">
    <h2>Runda: <span id="round"></span> | Faza: <span id="phase"></span></h2>
    <select id="set">
      <option value="set1">Zestaw 1</option>
      <option value="set2">Zestaw 2</option>
      <option value="set3">Zestaw 3</option>
    </select>
    <button class="btn-green" onclick="socket.emit('startGame', { questionSet: document.getElementById('set').value })">Start Gry</button>
    <button onclick="socket.emit('togglePause')">Pauza</button>
    <button onclick="socket.emit('startNextRound')">Następna Runda</button>
  </div>

  <div id="override" class="card" style="display:none; border:2px solid #e94560;">
    <h3>Odrzucono odpowiedź: <b id="wrong-text"></b></h3>
    <p>Gracz: <span id="wrong-player"></span></p>
    <select id="correct-idx"></select>
    <button class="btn-green" onclick="submitOverride()">UZNAJ TĘ ODPOWIEDŹ</button>
  </div>

  <div class="card">
    <h3>Gracze (Kłamca: <b id="liar"></b>)</h3>
    <div id="players"></div>
  </div>
</div>

<script>
const socket = io();
function login() {
  const p = document.getElementById('pwd').value;
  fetch('/admin/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:p}) })
  .then(r=>r.json()).then(d=>{
    if(d.ok){ document.getElementById('login').style.display='none'; document.getElementById('main').style.display='block'; socket.emit('joinAdmin', {password:p}); }
  });
}

function submitOverride() {
  const idx = document.getElementById('correct-idx').value;
  if(idx !== "") socket.emit('adminOverride', { answerIndex: parseInt(idx) });
}

socket.on('state', s => {
  document.getElementById('round').textContent = s.currentRound;
  document.getElementById('phase').textContent = s.phase;
  document.getElementById('liar').textContent = s.liarName || '---';
  document.getElementById('players').innerHTML = s.players.map(p => `<div>${p.name}: ${p.score} pkt ${p.isLiar?'🎭':''}</div>`).join('');

  const ov = document.getElementById('override');
  if (s.lastWrongAnswer) {
    ov.style.display = 'block';
    document.getElementById('wrong-text').textContent = s.lastWrongAnswer.text;
    document.getElementById('wrong-player').textContent = s.lastWrongAnswer.playerName;
    const sel = document.getElementById('correct-idx');
    sel.innerHTML = '<option value="">-- Wybierz poprawną --</option>';
    s.allAnswers.forEach((a, i) => {
      if(!s.revealedAnswers.some(r => r.index === i)) sel.innerHTML += `<option value="${i}">${a.text} (${a.points})</option>`;
    });
  } else ov.style.display = 'none';
});
</script>
</body>
</html>

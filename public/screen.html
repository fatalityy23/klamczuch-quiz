<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ekran publiczny - Klamczuch</title>
<script src="/socket.io/socket.io.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#080910; --panel:#151827; --line:#2a3048; --text:#f4f6fb; --muted:#9aa3b7; --accent:#ff2a5f; --blue:#00b4d8; --green:#00e676; --yellow:#ffd700; }
  * { box-sizing:border-box; margin:0; padding:0; font-family:'Poppins', sans-serif; }
  body { min-height:100vh; background:var(--bg); color:var(--text); padding:28px; }
  .layout { display:grid; grid-template-columns:2fr 1fr; gap:20px; max-width:1600px; margin:0 auto; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:22px; }
  .hero { min-height:310px; display:flex; flex-direction:column; justify-content:center; gap:18px; }
  h1 { font-size:clamp(2rem, 5vw, 5rem); color:var(--yellow); text-transform:uppercase; line-height:1; }
  h2 { color:var(--blue); font-size:1.5rem; margin-bottom:12px; }
  .phase { color:var(--green); font-weight:800; font-size:1.3rem; text-transform:uppercase; }
  .question { font-size:clamp(1.5rem, 3vw, 3rem); font-weight:800; }
  .answers { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:10px; }
  .answer { display:flex; justify-content:space-between; gap:16px; padding:12px 14px; border-radius:6px; background:#101320; border-left:4px solid var(--blue); font-size:1.2rem; }
  .answer.hidden { opacity:0.35; border-left-color:#3a4056; }
  .score { display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line); font-size:1.25rem; }
  .score strong { color:var(--yellow); }
  .events { display:flex; flex-direction:column; gap:8px; max-height:390px; overflow:hidden; }
  .event { color:var(--muted); border-left:3px solid var(--line); padding-left:10px; font-size:0.95rem; }
  @media (max-width: 900px) { body { padding:14px; } .layout { grid-template-columns:1fr; } .answers { grid-template-columns:1fr; } }
</style>
</head>
<body>
<main class="layout">
  <section class="panel hero">
    <div class="phase" id="phase">Lobby</div>
    <h1 id="headline">Klamczuch Quiz</h1>
    <div class="question" id="question">Czekamy na start gry</div>
    <div id="answers" class="answers"></div>
  </section>

  <aside style="display:flex; flex-direction:column; gap:20px;">
    <section class="panel">
      <h2>Ranking</h2>
      <div id="scores"></div>
    </section>
    <section class="panel">
      <h2>Ostatnie zdarzenia</h2>
      <div id="events" class="events"></div>
    </section>
  </aside>
</main>

<script>
const socket = io();
socket.emit('joinPublic');

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

function phaseLabel(s) {
  const labels = {
    lobby: 'Poczekalnia',
    liarDemo: 'Instrukcja klamczucha',
    round: 'Runda ' + s.currentRound,
    battlePrep: 'Przygotowanie do bitwy',
    battle: 'Bitwa o haslo',
    roundSummary: 'Podsumowanie rundy',
    scoreboard: 'Ranking',
    voting: 'Glosowanie',
    votingResults: 'Wyniki glosowania',
    preFinal: 'Przed finalem',
    speeches: 'Mowy finalowe',
    finalVoting: 'Finalowe glosowanie',
    finalSummary: 'Koniec gry'
  };
  return labels[s.phase] || s.phase;
}

socket.on('state', s => {
  document.getElementById('phase').textContent = phaseLabel(s);
  document.getElementById('headline').textContent = s.phase === 'finalSummary' ? 'Koniec gry' : 'Klamczuch Quiz';
  const question = s.questionText || s.director?.nextAction || 'Czekamy na kolejny etap';
  document.getElementById('question').textContent = question;

  const answers = document.getElementById('answers');
  answers.innerHTML = '';
  const visibleAnswers = s.allAnswers || (s.phase === 'round' ? Array.from({ length: s.answerCount || 10 }, (_, i) => ({ text: '???', points: '---', hidden: true, index: i })) : []);
  visibleAnswers.forEach((answer, i) => {
    const revealed = s.revealedAnswers?.find(r => r.index === i);
    const text = revealed ? revealed.text : (answer.hidden ? '???' : answer.text);
    const points = revealed ? revealed.points : (answer.hidden ? '---' : answer.points);
    const div = document.createElement('div');
    div.className = 'answer' + (!revealed && answer.hidden ? ' hidden' : '');
    div.innerHTML = `<span>${i + 1}. ${escapeHtml(text)}</span><strong>${escapeHtml(points)} pkt</strong>`;
    answers.appendChild(div);
  });

  document.getElementById('scores').innerHTML = (s.players || []).map((p, i) => `
    <div class="score"><span>${i + 1}. ${escapeHtml(p.name)}</span><strong>${p.score} pkt</strong></div>
  `).join('');

  document.getElementById('events').innerHTML = (s.eventLog || []).slice(0, 10).map(e => `
    <div class="event">${escapeHtml(e.message)}</div>
  `).join('') || '<div class="event">Brak zdarzen.</div>';
});
</script>
</body>
</html>
